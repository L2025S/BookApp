<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg" [class.bg-dark]="darkMode" [class.bg-light]="!darkMode">
  <div class="container">
    <a class="navbar-brand" [class.text-white]="darkMode">📚 Book & Quote Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/books" routerLinkActive="active" [class.text-white]="darkMode">📖 My Books</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/quotes" routerLinkActive="active" [class.text-white]="darkMode">💬 My Quotes</a>
        </li>
      </ul>
      <div class="d-flex">
        <button class="btn btn-outline-secondary me-2 theme-toggle" (click)="toggleDarkMode()">
          {{ darkMode ? '☀️ Light' : '🌙 Dark' }}
        </button>
        @if (isLoggedIn) {
          <button class="btn btn-danger" (click)="logout()">🚪 Logout</button>
        }
      </div>
    </div>
  </div>
</nav>

<!-- Router Outlet -->
<div class="container mt-4">
  <router-outlet></router-outlet>
</div>
